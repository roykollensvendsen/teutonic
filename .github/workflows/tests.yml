# CI workflow for the teutonic test suite.
#
# Runs ruff + pytest on every push and pull_request that targets
# tests/foundation. Does NOT trigger on main — that branch tracks
# upstream (unarbos/teutonic) and isn't ours to validate.
#
# Compat-soak matrix (M27): the suite runs twice — once against the
# active chain.toml (default, Teutonic-LXXX / Qwen3-MoE) and once with
# TEUTONIC_CHAIN_OVERRIDE pointing at tests/_fixtures/chain.quasar.toml
# (dormant Teutonic-XXIV / Quasar). The second run exercises the
# arch_specific(archs.quasar) tests that are auto-skipped under LXXX,
# proving the chain-cutover plumbing still works mechanically as
# upstream evolves. If a future upstream change breaks the Quasar path
# the alt-chain entry catches it before the next cutover lands.
#
# Caching strategy: uv-managed pip cache keyed on pyproject.toml so
# subsequent runs reuse the heavy torch/transformers/bittensor
# downloads. Expected runtime: ~5 min cold, ~2 min warm per matrix entry.

name: tests

on:
  push:
    branches: [tests/foundation]
  pull_request:
    branches: [tests/foundation]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - chain: active
            override: ""
          - chain: quasar
            override: tests/_fixtures/chain.quasar.toml
    name: test (${{ matrix.chain }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create venv and install dependencies (CPU-only torch)
        # The CPU-only PyTorch wheel index keeps the install reasonable
        # for CI. The validator + eval modules import torch at module
        # load, so a real torch install is required for test collection.
        # Both [dev,test] extras pull in ruff + pytest{,-mock,-asyncio}.
        run: |
          uv venv
          uv pip install -e ".[dev,test]" \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff check
        # Ruff is chain-agnostic; only run on the active matrix entry
        # to avoid duplicating identical output.
        if: matrix.chain == 'active'
        run: |
          source .venv/bin/activate
          ruff check --config scripts/teutonic.ruff.toml tests/

      - name: Pytest (parallel + coverage)
        # `-n auto` parallelises across runner cores. ubuntu-latest has
        # 4 cores typically; suite drops from ~90s serial to ~30s parallel.
        # `--cov` collects coverage across the source dirs configured in
        # pyproject's [tool.coverage.run]. Empty TEUTONIC_CHAIN_OVERRIDE
        # falls through to the in-tree chain.toml in chain_config.py.
        env:
          TEUTONIC_CHAIN_OVERRIDE: ${{ matrix.override }}
        run: |
          source .venv/bin/activate
          pytest tests/ -v -n auto \
            --cov \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage artifact
        # Always-uploaded; available even on failed runs for diagnosis.
        # Artifact name disambiguated per matrix entry to avoid name
        # collisions on parallel uploads.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.chain }}-${{ github.run_id }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
