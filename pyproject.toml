[project]
name = "teutonic"
version = "0.1.0"
description = "Holy pretraining incentives — Bittensor SN3 (Teutonic) validator + miner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bittensor",
    "boto3",
    "httpx",
    "numpy",
    "scipy",
    "huggingface-hub",
    "hf_transfer>=0.1",
    "safetensors",
    "torch",
    "transformers",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = ["ruff"]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.0",
    "pytest-cov>=5.0",
    # Runtime deps that test collection imports transitively but
    # which are not declared in [project] dependencies. archs/quasar
    # imports `fla` (flash-linear-attention) and eval/torch_runner
    # imports `accelerate`. Listing them here keeps the test extra
    # self-sufficient (`uv pip install -e ".[test]"` Just Works) without
    # taking a position on whether they belong in core dependencies —
    # that's an open upstream question.
    # The SILX-LABS fork of flash-linear-attention adds the `quasar`
    # layer (fla.layers.quasar.QuasarAttention) that archs/quasar/
    # imports. PyPI's flash-linear-attention 0.5.0 does NOT include this
    # layer — using the git URL pinned to the commit local development
    # has been validated against. If upstream adopts the fork or the fork
    # publishes to PyPI, we can switch to a version pin.
    "flash-linear-attention @ git+https://github.com/SILX-LABS/quasar-flash-linear-attention.git@84ad1cc5a7428609d7e0e56d4041a775cd19b7bb",
    "accelerate",
    # `fla` imports `triton` unconditionally at module load. The CPU-only
    # PyTorch wheels (used in CI to save space) don't bundle triton, so we
    # add it here explicitly. fla detects unsupported platforms and falls
    # back to CPU, so the import just needs to succeed.
    "triton",
]

[project.urls]
Homepage = "https://teutonic.ai"
Repository = "https://github.com/unarbos/teutonic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that take >1s individually (e.g. load_model retry-backoff path). Skip locally with `pytest -m 'not slow'` for fast iteration.",
    "integration: tests that exercise multiple harness modules together (chain + eval-server + tick). Run focused with `pytest -m integration`.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
# What gets measured. Excluded: tests themselves, package __init__.py
# (mostly re-exports), and the silx-ai dynamic-import shim files.
source = ["validator", "miner", "eval_server", "archs", "eval"]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    # Defensive `if __name__ == \"__main__\":` blocks aren't run in tests.
    "if __name__ == .__main__.:",
]
# Don't fail on coverage threshold yet — we have no baseline. A
# threshold can be added later once `coverage report` shows steady
# numbers across a few runs.

[tool.hatch.metadata]
# Allow git URL references in [project.optional-dependencies] — required
# for the pinned SILX-LABS fork of flash-linear-attention in [test].
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["archs", "eval"]
only-include = [
    "validator.py",
    "miner.py",
    "eval_server.py",
    "chain_config.py",
    "chain.toml",
    "archs",
    "eval",
]

[tool.ruff]
line-length = 100
target-version = "py311"
