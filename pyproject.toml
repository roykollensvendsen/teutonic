[project]
name = "teutonic"
version = "0.1.0"
description = "Holy pretraining incentives — Bittensor SN3 (Teutonic) validator + miner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bittensor",
    "boto3",
    "httpx",
    "numpy",
    "scipy",
    "huggingface-hub",
    "hf_transfer>=0.1",
    "safetensors",
    "torch",
    "transformers",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = ["ruff"]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    # Runtime deps that test collection imports transitively but
    # which are not declared in [project] dependencies. archs/quasar
    # imports `fla` (flash-linear-attention) and eval/torch_runner
    # imports `accelerate`. Listing them here keeps the test extra
    # self-sufficient (`uv pip install -e ".[test]"` Just Works) without
    # taking a position on whether they belong in core dependencies —
    # that's an open upstream question.
    "flash-linear-attention",
    "accelerate",
    # `fla` imports `triton` unconditionally at module load. The CPU-only
    # PyTorch wheels (used in CI to save space) don't bundle triton, so we
    # add it here explicitly. fla detects unsupported platforms and falls
    # back to CPU, so the import just needs to succeed.
    "triton",
]

[project.urls]
Homepage = "https://teutonic.ai"
Repository = "https://github.com/unarbos/teutonic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archs", "eval"]
only-include = [
    "validator.py",
    "miner.py",
    "eval_server.py",
    "chain_config.py",
    "chain.toml",
    "archs",
    "eval",
]

[tool.ruff]
line-length = 100
target-version = "py311"
